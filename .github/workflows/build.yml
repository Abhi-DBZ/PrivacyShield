name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      # Debug-signed: for trying a change. Releases are signed with the project key and attached by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyShield-apk
          path: app/build/outputs/apk/release/*.apk
